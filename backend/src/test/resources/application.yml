spring:
  datasource:
    url: jdbc:h2:mem:hrms;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-32+
    ttl-minutes: 60
  cors:
    allowed-origins: http://localhost
  seed:
    enabled: false
    admin-email: admin@test.local
    admin-password: password123
    employee-email: emp@test.local
    employee-password: password123
