spring:
  application:
    name: hrms-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/anganwadi_hrms}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  jwt:
    # 256-bit secret used to sign HS256 tokens. Override in any non-local env.
    secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-xx}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DEFAULT_USERS:true}
    admin-email: admin@anganwadi.local
    admin-password: password123
    employee-email: employee@anganwadi.local
    employee-password: password123

logging:
  level:
    org.springframework.security: INFO
